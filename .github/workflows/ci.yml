name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# terminal is a GLFW/Vulkan terminal emulator. Its only external dependency is
# textrender (the terminal_common/core/pty_posix/glfw_vulkan crates are nested in
# this repo; aunit and df_vulkan come from the Alire community index). Each nested
# crate's smoke suite is a gpr that "with"s aunit and is built from that crate's
# directory via `alr exec -- gprbuild` (per README).
#
# Windows has no PTY backend yet (terminal_pty is POSIX-only), so its job is
# allowed to fail: it tracks the gap and will go green on its own once a ConPTY
# backend lands.

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out terminal
        uses: actions/checkout@v7
        with: { path: terminal }
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: terminal
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install system libraries (Linux)
        run: |
          sudo apt-get update
          # Vulkan loader + Mesa lavapipe (software ICD) for the headless GPU
          # smokes; the X11 -dev libraries are GLFW's build inputs (glfw_vulkan
          # builds GLFW from source); xvfb gives the render smokes a display.
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libharfbuzz-dev \
            libglfw3-dev \
            mesa-vulkan-drivers \
            xvfb \
            fonts-dejavu-core \
            libxcursor-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev
      - name: Build terminal
        working-directory: terminal
        run: alr --non-interactive build

      - name: Core smoke suite
        working-directory: terminal/terminal_core
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/core_tests.gpr
          for t in tests/bin/*_smoke; do echo "== $t =="; "$t" || exit 1; done
      - name: PTY smoke suite
        working-directory: terminal/terminal_pty
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/pty_tests.gpr
          for t in tests/bin/*_smoke; do echo "== $t =="; "$t" || exit 1; done
      - name: App smoke suite (software Vulkan under Xvfb)
        working-directory: terminal/terminal_glfw_vulkan_app
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/app_tests.gpr
          xvfb-run -a bash -c 'for t in tests/bin/*_smoke; do echo "== $t =="; "$t" || exit 1; done'

  macos:
    name: macOS build + tests
    # macos-latest is arm64; gnat_native=15.2.1 ships no aarch64-darwin binary.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with: { path: terminal }
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: terminal
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install system libraries (macOS)
        run: |
          brew update
          # MoltenVK provides the Vulkan loader/ICD on macOS; glfw is linked by
          # the glfw_vulkan crate.
          brew install vulkan-headers vulkan-loader molten-vk glfw harfbuzz
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build terminal
        working-directory: terminal
        run: alr --non-interactive build
      - name: Build the smoke suites (link check)
        working-directory: terminal
        run: |
          ( cd terminal_core && alr --non-interactive exec -- gprbuild -p -P tests/core_tests.gpr )
          ( cd terminal_pty && alr --non-interactive exec -- gprbuild -p -P tests/pty_tests.gpr )
          ( cd terminal_glfw_vulkan_app && alr --non-interactive exec -- gprbuild -p -P tests/app_tests.gpr )
      - name: Run the headless-safe smokes (core + PTY)
        working-directory: terminal
        # The Vulkan render smokes need a GPU the runner lacks; core (pure terminal
        # logic) and PTY (POSIX, works on Darwin) run headless.
        run: |
          for t in terminal_core/tests/bin/*_smoke; do echo "== $t =="; "$t" || exit 1; done
          for t in terminal_pty/tests/bin/*_smoke; do echo "== $t =="; "$t" || exit 1; done

  windows:
    name: Windows build + PTY smoke
    runs-on: windows-latest
    # Still non-blocking, and now for a narrower reason than before.
    #
    # Windows builds, links and runs the PTY smokes: pty_close passes, and the
    # spawn itself reports every step succeeding -- pipes, pseudo-console,
    # attribute list, process, no error. What does not work is output: the shell
    # starts, produces nothing readable, and exits. pty_env fails on that.
    #
    # Make this blocking when the output path works. Until then it is tracking a
    # known and specific defect rather than a whole missing platform.
    continue-on-error: true
    env:
      # Selects the ConPTY backend. The project language has no conditional
      # expressions, so the crate cannot work the host out for itself.
      TERMINAL_PTY_OS: windows
    steps:
      - uses: actions/checkout@v7
        with: { path: terminal }
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: terminal
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install system libraries (Windows)
        shell: bash
        run: |
          # Alire's gnat_native is mingw-w64, so its linker needs mingw import
          # libraries. Take vulkan and glfw from the runner's MSYS2.
          #
          # vulkan-headers as well as the loader: the loader carries the import
          # library, but glfw3.h includes vulkan/vulkan.h, and the C shim in
          # glfw_vulkan includes glfw3.h. Without the headers the build died on a
          # missing vulkan/vulkan.h -- which is what this job had been failing on,
          # unnoticed, because it is allowed to fail. macOS installs both already.
          pacman() { /c/msys64/usr/bin/pacman "$@"; }
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true
          packages="mingw-w64-x86_64-vulkan-loader
                    mingw-w64-x86_64-vulkan-headers
                    mingw-w64-x86_64-glfw
                    mingw-w64-x86_64-harfbuzz"
          sync() { pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages; }
          synced=""
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"; sleep 15
          done
          if [ -z "$synced" ]; then
            sed 's/^SigLevel.*/SigLevel = Never/' /c/msys64/etc/pacman.conf \
              > /c/msys64/tmp/pacman-nosig.conf
            for attempt in 1 2 3; do
              if sync --config C:/msys64/tmp/pacman-nosig.conf; then synced=yes; break; fi
              echo "::warning::unsigned pacman sync attempt ${attempt} failed"; sleep 15
            done
          fi
          [ -n "$synced" ] || { echo "::error::could not install the MSYS2 packages"; exit 1; }
          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"
      - name: Build terminal
        working-directory: terminal
        run: alr --non-interactive build
      - name: PTY smoke (ConPTY)
        # The point of the whole job. A backend that compiles says nothing about
        # whether it can start a shell, so this spawns one, writes to it, reads
        # what comes back, and closes it.
        shell: bash
        working-directory: terminal/terminal_pty
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/pty_tests.gpr \
            -XTERMINAL_PTY_OS=windows
          for t in tests/bin/*_smoke.exe; do
            echo "== $t =="
            "$t" || exit 1
          done

