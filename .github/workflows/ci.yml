name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# terminal is a GLFW/Vulkan terminal emulator. Its external source dependencies
# include the sibling textrender, zlib, jpeglib, and giflib crates (the
# terminal_common/core/pty/glfw_vulkan crates are nested in this repo; aunit and
# df_vulkan come from the Alire community index). CI jobs may enter a nested
# crate after setup-alire has selected the exact compiler; local commands in the
# README stay at the repository root so the manifest pin selects that compiler.
#
# `terminal_pty` selects POSIX on Linux/macOS and ConPTY on Windows. The Windows
# job is blocking and exercises real shell spawn, I/O, resize, and close rather
# than serving as a compile-only portability check.

jobs:
  linux:
    name: Linux build + tests
    # Noble carries the Unicode 15.1 dataset used by the generated tables.
    # Keep both the runner and package revision fixed so regeneration is
    # independent of ubuntu-latest transitions.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out terminal
        uses: actions/checkout@v7
        with: { path: terminal }
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@5ed5f4dcfa10301345933d45e5f78ac0573d8cff
        with:
          root: terminal
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install system libraries (Linux)
        run: |
          sudo apt-get update
          # Vulkan loader + Mesa lavapipe (software ICD) for the headless GPU
          # smokes; the X11 -dev libraries are GLFW's build inputs (glfw_vulkan
          # builds GLFW from source); xvfb gives the render smokes a display.
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libharfbuzz-dev \
            libglfw3-dev \
            mesa-vulkan-drivers \
            xvfb \
            xauth \
            chafa \
            libsixel-bin \
            glslang-tools=15.1.0-2~ubuntu0.24.04.2 \
            tmux \
            util-linux \
            fonts-dejavu-core \
            unicode-data=15.1.0-1 \
            libxcursor-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev
      - name: Build terminal
        working-directory: terminal
        run: alr --non-interactive build
      - name: Build Ada graphics probe tools
        working-directory: terminal
        run: alr --non-interactive exec -- gprbuild -p -P tools/graphics_tools.gpr
      - name: Verify committed SPIR-V shaders
        working-directory: terminal
        run: |
          shader_check="$(mktemp -d)"
          glslangValidator -V terminal_glfw_vulkan_app/assets/shaders/terminal.vert \
            -o "$shader_check/terminal.vert.spv"
          glslangValidator -V terminal_glfw_vulkan_app/assets/shaders/terminal.frag \
            -o "$shader_check/terminal.frag.spv"
          cmp "$shader_check/terminal.vert.spv" \
            terminal_glfw_vulkan_app/assets/shaders/terminal.vert.spv
          cmp "$shader_check/terminal.frag.spv" \
            terminal_glfw_vulkan_app/assets/shaders/terminal.frag.spv
      - name: Verify generated Unicode 15.1 tables
        working-directory: terminal
        run: |
          tools/bin/generate_unicode_character_properties \
            /usr/share/unicode/UnicodeData.txt \
            /usr/share/unicode/EastAsianWidth.txt \
            /usr/share/unicode/emoji/emoji-variation-sequences.txt \
            terminal_core/src/terminal-core-character_properties_data.ads \
            --check
          tools/bin/generate_text_properties \
            /usr/share/unicode/Scripts.txt \
            /usr/share/unicode/extracted/DerivedBidiClass.txt \
            /usr/share/unicode/emoji/emoji-data.txt \
            terminal_glfw_vulkan_app/src/terminal-app-text_properties_data.ads \
            --check
          tools/bin/unicode_generator_support_smoke

      - name: C string ownership smoke
        working-directory: terminal/c_string_ownership
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/c_string_ownership_tests.gpr
          alr --non-interactive exec -- gprbuild -p -P tests/c_string_ownership_failure_tests.gpr
          tests/bin/c_string_ownership_smoke
          tests/bin/c_string_ownership_failure_smoke
      - name: Core smoke suite
        working-directory: terminal/terminal_core
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/core_tests.gpr
          for test in tests/bin/*_smoke; do
            echo "== $test =="
            "$test" || exit 1
          done
      - name: PTY smoke suite
        working-directory: terminal/terminal_pty
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/pty_tests.gpr
          for t in tests/bin/*_smoke; do echo "== $t =="; "$t" || exit 1; done
      - name: App smoke suite (software Vulkan under Xvfb)
        working-directory: terminal/terminal_glfw_vulkan_app
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          TERMINAL_REQUIRE_GUI_PRESENT: "1"
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/app_tests.gpr
          xvfb-run -a bash -c '
            for test in tests/bin/*_smoke; do
              echo "== $test =="
              "$test" || exit 1
            done'
      - name: Graphics pipeline corpus and instrumentation smoke
        working-directory: terminal/terminal_glfw_vulkan_app
        run: |
          alr --non-interactive exec -- gprbuild -p -P fuzz/graphics_pipeline_fuzz.gpr
          fuzz/bin/afl_coverage_smoke \
            fuzz/bin/graphics_pipeline_fuzz_target \
            fuzz/corpus/kitty_rgba fuzz/corpus/kitty_png
          fuzz/bin/graphics_pipeline_fuzz_target fuzz/corpus/iterm_gif
          fuzz/bin/graphics_pipeline_fuzz_target fuzz/corpus/sixel
      - name: Released client and tmux interoperability probes
        working-directory: terminal
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          ( cd terminal_core && alr --non-interactive exec -- \
              gprbuild -p -P fuzz/core_graphics_fuzz.gpr )
          tools/bin/external_graphics_clients_probe
          tools/bin/tmux_graphics_passthrough_probe
          xvfb-run -a tools/bin/tmux_graphics_passthrough_probe --present

  macos:
    name: macOS build + tests
    # macos-latest is arm64; gnat_native=15.2.1 ships no aarch64-darwin binary.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with: { path: terminal }
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@5ed5f4dcfa10301345933d45e5f78ac0573d8cff
        with:
          root: terminal
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install system libraries (macOS)
        run: |
          brew update
          # The Intel image can still have openssl@1.1 linked. Harfbuzz pulls an
          # openssl@3 upgrade, whose link step otherwise collides with it.
          brew unlink openssl@1.1 || true
          # MoltenVK provides the Vulkan loader/ICD on macOS; glfw is linked by
          # the glfw_vulkan crate.
          brew install vulkan-headers vulkan-loader molten-vk glfw harfbuzz
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build terminal
        working-directory: terminal
        run: alr --non-interactive build
      - name: Build the smoke suites (link check)
        working-directory: terminal
        run: |
          ( cd c_string_ownership && alr --non-interactive exec -- gprbuild -p -P tests/c_string_ownership_tests.gpr )
          ( cd c_string_ownership && alr --non-interactive exec -- gprbuild -p -P tests/c_string_ownership_failure_tests.gpr )
          ( cd terminal_core && alr --non-interactive exec -- gprbuild -p -P tests/core_tests.gpr )
          ( cd terminal_pty && alr --non-interactive exec -- gprbuild -p -P tests/pty_tests.gpr )
          ( cd terminal_glfw_vulkan_app && alr --non-interactive exec -- gprbuild -p -P tests/app_tests.gpr )
      - name: Run the headless-safe smokes (core + PTY)
        working-directory: terminal
        # The Vulkan render smokes need a GPU the runner lacks; core (pure terminal
        # logic) and PTY (POSIX, works on Darwin) run headless.
        run: |
          c_string_ownership/tests/bin/c_string_ownership_smoke
          c_string_ownership/tests/bin/c_string_ownership_failure_smoke
          for t in terminal_core/tests/bin/*_smoke; do echo "== $t =="; "$t" || exit 1; done
          for t in terminal_pty/tests/bin/*_smoke; do echo "== $t =="; "$t" || exit 1; done

  windows:
    name: Windows build + PTY smoke
    runs-on: windows-latest
    # Blocking, as of the run where the shell finally came up: the ConPTY
    # backend starts cmd, the banner and prompt come back through the console,
    # a resize is observed by the child, and the PTY smokes pass.
    env:
      # Selects the ConPTY backend. The project language has no conditional
      # expressions, so the crate cannot work the host out for itself.
      TERMINAL_PTY_OS: windows
    steps:
      - uses: actions/checkout@v7
        with: { path: terminal }
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@5ed5f4dcfa10301345933d45e5f78ac0573d8cff
        with:
          root: terminal
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install system libraries (Windows)
        shell: bash
        run: |
          # Alire's gnat_native is mingw-w64, so its linker needs mingw import
          # libraries. Take vulkan and glfw from the runner's MSYS2.
          #
          # Keep vulkan-headers alongside the loader for dependency builds,
          # Vulkan tooling, and the small GLFW ownership-publication C shim.
          # macOS installs both too.
          pacman() { /c/msys64/usr/bin/pacman "$@"; }
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true
          packages="mingw-w64-x86_64-vulkan-loader
                    mingw-w64-x86_64-vulkan-headers
                    mingw-w64-ucrt-x86_64-glfw
                    mingw-w64-x86_64-harfbuzz"
          sync() { pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages; }
          synced=""
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"; sleep 15
          done
          [ -n "$synced" ] || { echo "::error::could not install the MSYS2 packages"; exit 1; }
          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib;C:/msys64/ucrt64/lib" >> "$GITHUB_ENV"
          # MSYS2 dropped glfw from MINGW64; it comes from UCRT64 (linked via its DLL
          # import library). Each line is prepended to PATH, so MINGW64 stays first.
          echo "C:\msys64\ucrt64\bin" >> "$GITHUB_PATH"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"
      - name: Build terminal
        working-directory: terminal
        run: alr --non-interactive build
      - name: C string ownership smoke
        shell: bash
        working-directory: terminal/c_string_ownership
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/c_string_ownership_tests.gpr
          alr --non-interactive exec -- gprbuild -p -P tests/c_string_ownership_failure_tests.gpr
          tests/bin/c_string_ownership_smoke.exe
          tests/bin/c_string_ownership_failure_smoke.exe
      - name: PTY smoke (ConPTY)
        # The point of the whole job. A backend that compiles says nothing about
        # whether it can start a shell, so this spawns one, writes to it, reads
        # what comes back, and closes it.
        shell: bash
        working-directory: terminal/terminal_pty
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/pty_tests.gpr \
            -XTERMINAL_PTY_OS=windows -XTERMINAL_PTY_BUILD=testing
          for t in tests/bin/windows/*_smoke.exe; do
            echo "== $t =="
            "$t" || exit 1
          done
      - name: Windows URI launcher smoke
        shell: bash
        working-directory: terminal/terminal_glfw_vulkan_app
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/app_tests.gpr \
            -XTERMINAL_PTY_OS=windows hyperlink_smoke.adb
          tests/bin/windows/hyperlink_smoke.exe
      - name: Windows session shutdown smoke
        shell: bash
        working-directory: terminal/terminal_glfw_vulkan_app
        run: |
          alr --non-interactive exec -- gprbuild -p -P tests/app_tests.gpr \
            -XTERMINAL_PTY_OS=windows session_shutdown_smoke.adb
          tests/bin/windows/session_shutdown_smoke.exe
