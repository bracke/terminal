name: graphics pipeline fuzz

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  afl-coverage:
    runs-on: ubuntu-latest
    # Two 420 s campaigns plus a cold build of terminal and its siblings.
    timeout-minutes: 45
    steps:
      - name: Check out terminal
        uses: actions/checkout@v7
        with: { path: terminal }
      - name: Check out sibling crates
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@5ed5f4dcfa10301345933d45e5f78ac0573d8cff
        with:
          root: terminal
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Configure Alire solver
        run: alr settings --global --set solver.timeout 600
      - name: Install AFL++ and graphics build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            afl++ \
            libvulkan-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libglfw3-dev \
            libxcursor-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev
      - name: Build terminal
        # Generates the Alire config projects (zlib_config.gpr, giflib's build
        # profile, ...) that the raw gprbuild calls below depend on.
        working-directory: terminal
        run: alr --non-interactive build
      - name: Build Ada graphics tooling
        working-directory: terminal
        run: alr --non-interactive exec -- gprbuild -p -P tools/graphics_tools.gpr
      - name: Run bounded core parser campaign
        working-directory: terminal
        run: tools/bin/graphics_fuzz_runner 420 fuzz/findings core
      - name: Run bounded decode/store/render campaign
        working-directory: terminal
        run: tools/bin/graphics_fuzz_runner 420 fuzz/findings pipeline
      - name: Pack corpus and findings
        # AFL names its queue files id:000000,time:0,...; upload-artifact
        # refuses colons in paths, so the findings travel as one tarball.
        if: always()
        working-directory: terminal
        run: |
          dirs=""
          for d in terminal_core/fuzz/findings terminal_glfw_vulkan_app/fuzz/findings; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ -n "$dirs" ]; then tar -czf graphics-fuzz-findings.tar.gz $dirs; fi
      - name: Upload corpus and findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: graphics-fuzz-findings
          path: terminal/graphics-fuzz-findings.tar.gz
          if-no-files-found: warn
          retention-days: 14
